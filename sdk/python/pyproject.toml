[project]
name = "chronos-sdk"
version = "0.1.0"
description = "Chronos AI Agent Debugging SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "cloudpickle>=3.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "freezegun>=1.2.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
    "crewai>=0.28.0"
]
