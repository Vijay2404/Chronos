[project]
name = "chronos-server"
version = "0.1.0"
description = "Chronos Local Control Plane Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "duckdb>=1.0.0",
    "chronos-sdk"
]

[tool.uv.sources]
chronos-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
